route:
  image: python:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.route
    args:
      NODE_ENV: production
  ports:
    - "5000:5000"
  environment:
    - LOG_LEVEL=WARNING
    - CACHE_TTL=60
  volumes:
    - route_data:/var/lib/data
  restart: unless-stopped


profile:
  image: node:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.profile
    args:
      NODE_ENV: production
  ports:
    - "8080:8080"
  environment:
    - LOG_LEVEL=INFO
    - CACHE_TTL=120
  volumes:
    - profile_data:/var/lib/data
  restart: unless-stopped


migration:
  image: node:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.migration
    args:
      NODE_ENV: production
  ports:
    - "4000:4000"
  environment:
    - LOG_LEVEL=WARNING
    - CACHE_TTL=120
  volumes:
    - migration_data:/var/lib/data
  restart: unless-stopped


logger:
  image: python:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.logger
    args:
      NODE_ENV: production
  ports:
    - "8000:8000"
  environment:
    - LOG_LEVEL=INFO
    - CACHE_TTL=120
  volumes:
    - logger_data:/var/lib/data
  restart: unless-stopped
