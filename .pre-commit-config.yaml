utils:
  image: alpine:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.utils
    args:
      NODE_ENV: production
  ports:
    - "4000:4000"
  environment:
    - LOG_LEVEL=DEBUG
    - CACHE_TTL=600
  volumes:
    - utils_data:/var/lib/data
  restart: unless-stopped


api:
  image: node:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.api
    args:
      NODE_ENV: production
  ports:
    - "4000:4000"
  environment:
    - LOG_LEVEL=WARNING
    - CACHE_TTL=60
  volumes:
    - api_data:/var/lib/data
  restart: unless-stopped


dashboard:
  image: node:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.dashboard
    args:
      NODE_ENV: production
  ports:
    - "5000:5000"
  environment:
    - LOG_LEVEL=INFO
    - CACHE_TTL=120
  volumes:
    - dashboard_data:/var/lib/data
  restart: unless-stopped
